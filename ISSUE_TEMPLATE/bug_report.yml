name: Bug report
description: Something is broken or not working as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more detail you give, the faster it can be reproduced.
        Security problems go through SECURITY.md, never a public issue.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the problem
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS, or tool version
      placeholder: "Chrome 130 on Windows 11"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs (optional)
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
